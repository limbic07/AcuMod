[package]
name = "acumod"
version = "0.1.0"
description = "Acumod desktop application"
authors = ["Acumod contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "acumod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DeepSeek 对话由 Rust 发起；流式响应在后端解析后再通过 Tauri Channel 发送给前端。
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.31"
# API Key 必须进入系统凭据库，不能写进普通 JSON 配置。
keyring = "4.1.5"
# 狩技 MOD 盒子的 info.xml 是第三方结构化数据，使用 XML 解析器避免手写字符串匹配。
quick-xml = { version = "0.37", features = ["serialize"] }
# 知识包是自包含 SQLite 文件；bundled 让用户无需额外安装 SQLite。
rusqlite = { version = "0.40.1", features = ["bundled"] }
# 导入时计算整包 SHA-256，避免损坏包或被替换的暂存文件进入活动索引。
sha2 = "0.11.0"
tauri-plugin-dialog = "2"
